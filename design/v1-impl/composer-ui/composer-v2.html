<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IM Composer 首行预览</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: #f4f5f7;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 预览容器（居中展示） */
        .preview-card {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .title {
            font-size: 13px;
            color: #888;
            margin-bottom: 12px;
            text-align: center;
        }

        /* ================= 首行 Composer 容器 ================= */
        .composer-row {
            display: flex;
            align-items: flex-end; /* 底部对齐 */
            gap: 8px;
            width: 100%;
        }

        /* 1. 文件按钮（小，最左边） */
        .btn-file {
            width: 38px;
            height: 42px;
            border: none;
            background: transparent;
            color: #666;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            border-radius: 10px;
        }
        .btn-file:active { background: #eee; }

        /* 2. 文本输入框容器（占据剩余弹性空间） */
        .input-container {
            flex: 1;
            background: #f0f2f5;
            border-radius: 21px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            min-height: 42px;
            transition: all 0.2s ease;
        }

        .input-container:focus-within {
            background: #ffffff;
            box-shadow: 0 0 0 2px #4A68FF;
        }

        .text-input {
            width: 100%;
            border: none;
            background: transparent;
            outline: none;
            font-size: 15px;
            color: #222;
            resize: none;
            height: 22px;
            max-height: 100px;
            line-height: 22px;
            padding: 0;
            user-select: text;
        }

        /* 3. 语音大按钮 (占据整行约 1/3 宽度) */
        .btn-voice-large {
            width: 32%; /* 约占 1/3 宽度 */
            height: 42px;
            background: #4A68FF;
            color: white;
            border: none;
            border-radius: 21px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(74, 104, 255, 0.25);
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn-voice-large:active {
            transform: scale(0.96);
            background: #3b55e6;
        }

        /* 4. 发送按钮 (当有文本时展示，替换语音按钮) */
        .btn-send {
            width: 32%; /* 保持同样的 1/3 宽度大按钮样式 */
            height: 42px;
            background: #4A68FF;
            color: white;
            border: none;
            border-radius: 21px;
            display: none; /* 初始隐藏 */
            justify-content: center;
            align-items: center;
            gap: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(74, 104, 255, 0.25);
        }

        /* ================= 模式 2：单点独立录制栏 ================= */
        .voice-single-bar {
            display: none;
            width: 100%;
            height: 44px;
            background: #fff0f0;
            border-radius: 22px;
            padding: 0 8px 0 16px;
            align-items: center;
            justify-content: space-between;
        }

        .recording-timer {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ff3b30;
            font-weight: 600;
            font-size: 15px;
        }

        .dot-blink {
            width: 8px;
            height: 8px;
            background-color: #ff3b30;
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }

        /* 按钮重置 */
        .icon-btn {
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
        }

        /* Toast 提示 */
        .toast {
            margin-top: 20px;
            background: #333;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<div class="preview-card">
    <div class="title">首行元素原型预览（右侧语音占 1/3 宽）</div>

    <!-- 默认模式 / 输入模式 -->
    <div class="composer-row" id="normalComposer">
        <!-- 1. 发送文件 (左侧小图标) -->
        <button class="btn-file" id="btnFile" title="发送文件">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>

        <!-- 2. 文本输入框 -->
        <div class="input-container">
            <textarea class="text-input" id="textInput" placeholder="输入内容..." rows="1"></textarea>
        </div>

        <!-- 3. 语音大按钮 (占据 1/3 宽度) -->
        <button class="btn-voice-large" id="btnVoice">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            <span>语音</span>
        </button>

        <!-- 4. 发送大按钮 (有文本时替换语音按钮) -->
        <button class="btn-send" id="btnSend">
            <span>发送</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
    </div>

    <!-- 模式 2：单点独立录制栏 -->
    <div class="voice-single-bar" id="voiceSingleBar">
        <button class="icon-btn" id="btnCancelSingle" style="color:#ff3b30;" title="取消/删除">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>

        <div class="recording-timer">
            <div class="dot-blink"></div>
            <span>00:05</span>
        </div>

        <div style="display:flex; gap:8px;">
            <button class="icon-btn" style="color:#ff3b30; width:32px; height:32px;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
            </button>
            <button class="icon-btn" id="btnSendVoiceSingle" style="background:#4A68FF; color:white; width:32px; height:32px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
        </div>
    </div>
</div>

<div class="toast" id="toast">提示信息</div>

<script>
    const textInput = document.getElementById('textInput');
    const btnVoice = document.getElementById('btnVoice');
    const btnSend = document.getElementById('btnSend');
    const normalComposer = document.getElementById('normalComposer');
    const voiceSingleBar = document.getElementById('voiceSingleBar');
    const toast = document.getElementById('toast');

    let isLongPress = false;
    let longPressTimer = null;

    function showToast(msg) {
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1500);
    }

    // 文本输入与自适应
    textInput.addEventListener('focus', switchToTextState);
    textInput.addEventListener('input', () => {
        textInput.style.height = 'auto';
        textInput.style.height = Math.min(textInput.scrollHeight, 100) + 'px';
        switchToTextState();
    });

    textInput.addEventListener('blur', () => {
        if (textInput.value.trim() === '') {
            switchToInitialState();
        }
    });

    function switchToTextState() {
        btnVoice.style.display = 'none';
        btnSend.style.display = 'flex';
    }

    function switchToInitialState() {
        btnVoice.style.display = 'flex';
        btnSend.style.display = 'none';
        textInput.style.height = '22px';
    }

    btnSend.addEventListener('click', () => {
        showToast('发送文本：' + textInput.value);
        textInput.value = '';
        switchToInitialState();
    });

    // 语音大按钮：单点 / 长按识别
    btnVoice.addEventListener('mousedown', startPress);
    btnVoice.addEventListener('touchstart', startPress);
    btnVoice.addEventListener('mouseup', endPress);
    btnVoice.addEventListener('touchend', endPress);

    function startPress(e) {
        isLongPress = false;
        longPressTimer = setTimeout(() => {
            isLongPress = true;
            showToast('正在长按录音... (松开发送 / 滑动取消)');
        }, 300);
    }

    function endPress(e) {
        clearTimeout(longPressTimer);
        if (isLongPress) {
            showToast('长按结束：已发送语音');
        } else {
            // 单点
            normalComposer.style.display = 'none';
            voiceSingleBar.style.display = 'flex';
        }
    }

    document.getElementById('btnCancelSingle').addEventListener('click', () => {
        voiceSingleBar.style.display = 'none';
        normalComposer.style.display = 'flex';
        showToast('取消单点录音');
    });

    document.getElementById('btnSendVoiceSingle').addEventListener('click', () => {
        voiceSingleBar.style.display = 'none';
        normalComposer.style.display = 'flex';
        showToast('发送单点语音');
    });
</script>

</body>
</html>
